plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.2.0'
group = 'com.crafteos'
base { archivesName = 'crafteos_reemplazo' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { workingDirectory project.file('run'); property 'forge.logging.console.level', 'debug'; mods { crafteos_reemplazo { source sourceSets.main } } }
        server { workingDirectory project.file('run'); mods { crafteos_reemplazo { source sourceSets.main } } }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
}

jar {
    manifest { attributes 'Implementation-Title': 'crafteos_reemplazo', 'Implementation-Version': project.version }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
